<div class="flex items-center justify-center min-h-screen bg-amber-400">
  <div class="max-w-5xl w-full p-6">
    
    <h1 class="text-3xl font-extrabold text-black mb-8 border-b-4 border-gray-800 inline-block">
      Gestión de Usuarios - Veterinaria
    </h1>

    <!-- Formulario -->
    <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-300 mb-10">
      <h2 class="text-xl font-bold text-black mb-4">Registro Rápido</h2>
      <form (ngSubmit)="registrarUsuario()" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input [(ngModel)]="nuevoUsuario.nombre" name="nombre" type="text" placeholder="Nombre completo" required
          class="w-full px-4 py-2 rounded-lg border border-gray-400 bg-white text-black focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        
        <input [(ngModel)]="nuevoUsuario.email" name="email" type="email" placeholder="Correo" required
          class="w-full px-4 py-2 rounded-lg border border-gray-400 bg-white text-black focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        
        <input [(ngModel)]="nuevoUsuario.password" name="password" type="password" placeholder="***" required
          class="w-full px-4 py-2 rounded-lg border border-gray-400 bg-white text-black focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        
        <button type="submit" 
          class="md:col-span-3 bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-lg transition-colors shadow-lg">
          REGISTRAR
        </button>
      </form>
    </div>

    <!-- Tabla -->
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-300">
      <table class="w-full text-left border-collapse">
        <thead class="bg-gray-800 text-amber-400">
          <tr>
            <th class="p-4 font-semibold uppercase text-sm">Acciones</th>
            <th class="p-4 font-semibold uppercase text-sm">ID</th>
            <th class="p-4 font-semibold uppercase text-sm">Nombre</th>
            <th class="p-4 font-semibold uppercase text-sm">Email</th>
          </tr>
        </thead>
        <tbody>
          @for(usuario of listaUsuarios(); track usuario.id){
            <tr class="border-b border-gray-200 hover:bg-amber-100 transition-colors">
              <td class="p-4 text-black font-mono text-xs">
                @if (authService.rolActual()==='ADMIN') {
                  <button (click)="editarUsuario(usuario)" class="pr-10 text-blue-700">✏️​</button>
                  <button (click)="eliminarUsuario(usuario.id!)" class="text-red-600">🗑​</button>
                }@else {
                  <span class="text-amber-500">🔒</span>
                }
              </td>
              <td class="p-4 text-black font-mono text-xs">{{usuario.id}}</td>
              <td class="p-4 text-black font-medium">{{usuario.nombre}}</td>
              <td class="p-4 text-black">{{usuario.email}}</td>
            </tr>
          }
          @empty{
            <tr>
              <td colspan="4" class="p-8 text-center text-gray-600 italic">
                Cargando usuarios desde la API...
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
