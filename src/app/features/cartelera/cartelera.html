<app-hero
    titulo="MIRA EL CONTENIDO EN NUESTRA CARTELERA Y CONSULTA LOS HORARIOS"
    contenido="Haz clic sobre la pelicula para ver los horarios y opciones de compras de los boletos"
    imagen="https://i.postimg.cc/gJq6B5H4/80.jpg"
    textBoton="Mas informacion"
    colorBoton="bg-gray-800"

></app-hero>
<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
    @for(pelicula of peliculas(); track pelicula.id){
        <div>
        <img class="h-auto max-w-full rounded-base mb-2 mx-auto"
            [src]="pelicula.imagen"
            [alt]="pelicula.titulo">
        <h2 class="text-center font-bold text-base line-clamp-2 mb-1">
            {{ pelicula.titulo }}
        </h2>
        <p class="text-center text-sm text-gray-600 italic mb-2">
            {{ pelicula.genero }}
        </p>
        <p class="text-center font-bold text-xs text-gray-500 line-clamp-3">
            {{ pelicula.descripcion }}
        </p>
        <p class="text-center font-bold text-xs text-gray-500 line-clamp-3">
            {{ pelicula.anio }}
        </p>
        </div>
    }
</div>
