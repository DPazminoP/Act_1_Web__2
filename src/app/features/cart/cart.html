
<div class="min-h-screen bg-amber-400 flex items-center justify-center">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6">
    <h2 class="text-2xl font-bold text-black mb-4 text-center">🛒 Carrito de Compras</h2>

    <!-- Lista de productos -->
    <ul>
      <li *ngFor="let item of items" class="flex justify-between items-center bg-white rounded-lg px-3 py-2 mb-2 shadow">
        <span class="text-black font-medium">{{ item.nombre }}</span>
        <span class="text-black">${{ item.precio }}</span>
        <button (click)="remove(item.id)" class="text-red-600 hover:text-red-800 ml-4">🗑️</button>
        </li>
    </ul>

    <!-- Total -->
    <div class="flex justify-between items-center mt-4 border-t border-gray-300 pt-4">
        <span class="text-lg font-semibold text-black">Total:</span>
        <span class="text-lg font-bold text-black">${{ total }}</span>
    </div>

    <!-- Botones -->
    <div class="flex justify-between mt-6">
        <button    utton (click)="clear()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900">
            Vaciar carrito
        </button>
        <button class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900">
            Ir a pagar
        </button>
        </div>
    </div>
</div>
